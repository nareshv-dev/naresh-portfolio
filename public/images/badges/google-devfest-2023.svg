<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBC05;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Badge circle background -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="url(#bg)" stroke-width="5" filter="url(#shadow)"/>

  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#bg)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5"/>

  <!-- Google colors dots at top -->
  <circle cx="72" cy="30" r="6" fill="#4285F4"/>
  <circle cx="91" cy="22" r="6" fill="#EA4335"/>
  <circle cx="110" cy="22" r="6" fill="#FBBC05"/>
  <circle cx="129" cy="30" r="6" fill="#34A853"/>

  <!-- Firebase/DevFest flame icon -->
  <g transform="translate(100,78) scale(0.8)">
    <path d="M-18,10 L-8,-25 L2,0 Z" fill="#FBBC05"/>
    <path d="M-18,10 L12,25 L2,0 Z" fill="#EA4335"/>
    <path d="M12,25 L-18,10 L18,10 Z" fill="#EA4335" opacity="0.8"/>
    <path d="M-8,-25 L12,25 L18,-10 Z" fill="#4285F4"/>
    <path d="M-8,-25 L18,-10 L5,-18 Z" fill="#34A853"/>
  </g>

  <!-- DevFest text -->
  <text x="100" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="22" fill="#202124">
    DevFest
  </text>

  <!-- 2023 text -->
  <text x="100" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" fill="#5F6368">
    2023
  </text>

  <!-- GDG text at bottom -->
  <text x="100" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="11" fill="#4285F4" letter-spacing="2">
    GDG ATTENDEE
  </text>
</svg>