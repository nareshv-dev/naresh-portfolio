<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>

  <!-- Background - indoor room -->
  <rect width="600" height="340" fill="url(#bg2)"/>

  <!-- Floor -->
  <rect x="0" y="220" width="600" height="120" fill="#1e1e30" opacity="0.8"/>
  <line x1="0" y1="220" x2="600" y2="220" stroke="#333350" stroke-width="1"/>

  <!-- Wall details -->
  <rect x="40" y="40" width="120" height="160" fill="none" stroke="#2a2a45" stroke-width="2" rx="3"/>
  <line x1="100" y1="40" x2="100" y2="200" stroke="#2a2a45" stroke-width="1"/>
  <line x1="40" y1="120" x2="160" y2="120" stroke="#2a2a45" stroke-width="1"/>

  <!-- Furniture - table -->
  <rect x="420" y="140" width="140" height="6" fill="#3a3a55" rx="2"/>
  <rect x="430" y="146" width="6" height="74" fill="#2d2d48"/>
  <rect x="548" y="146" width="6" height="74" fill="#2d2d48"/>

  <!-- Camera view frame -->
  <rect x="0" y="0" width="600" height="340" fill="none" stroke="#444" stroke-width="3"/>

  <!-- ========== STANDING PERSON (LEFT) - Pose skeleton ========== -->
  <!-- Person body outline (semi-transparent) -->
  <ellipse cx="220" cy="78" rx="16" ry="18" fill="#4a6fa5" opacity="0.3"/>
  <!-- Pose skeleton - Standing -->
  <!-- Head -->
  <circle cx="220" cy="78" r="10" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Neck to mid-torso -->
  <line x1="220" y1="88" x2="220" y2="135" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Shoulders -->
  <line x1="195" y1="100" x2="245" y2="100" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Left arm -->
  <line x1="195" y1="100" x2="185" y2="130" stroke="#00e5ff" stroke-width="2.5"/>
  <line x1="185" y1="130" x2="180" y2="155" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Right arm -->
  <line x1="245" y1="100" x2="255" y2="130" stroke="#00e5ff" stroke-width="2.5"/>
  <line x1="255" y1="130" x2="260" y2="155" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Hips -->
  <line x1="205" y1="135" x2="235" y2="135" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Left leg -->
  <line x1="205" y1="135" x2="200" y2="175" stroke="#00e5ff" stroke-width="2.5"/>
  <line x1="200" y1="175" x2="198" y2="218" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Right leg -->
  <line x1="235" y1="135" x2="240" y2="175" stroke="#00e5ff" stroke-width="2.5"/>
  <line x1="240" y1="175" x2="242" y2="218" stroke="#00e5ff" stroke-width="2.5"/>
  <!-- Joints -->
  <circle cx="195" cy="100" r="3" fill="#00e5ff"/>
  <circle cx="245" cy="100" r="3" fill="#00e5ff"/>
  <circle cx="185" cy="130" r="3" fill="#00e5ff"/>
  <circle cx="255" cy="130" r="3" fill="#00e5ff"/>
  <circle cx="205" cy="135" r="3" fill="#00e5ff"/>
  <circle cx="235" cy="135" r="3" fill="#00e5ff"/>
  <circle cx="200" cy="175" r="3" fill="#00e5ff"/>
  <circle cx="240" cy="175" r="3" fill="#00e5ff"/>

  <!-- Standing person label -->
  <rect x="180" y="50" width="80" height="18" fill="rgba(0,229,255,0.15)" stroke="#00e5ff" stroke-width="1" rx="3"/>
  <text x="190" y="63" fill="#00e5ff" font-family="monospace" font-size="10" font-weight="bold">STANDING</text>

  <!-- Bounding box for standing person -->
  <rect x="170" y="60" width="100" height="165" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="5,3" rx="3" opacity="0.5"/>


  <!-- ========== FALLING PERSON (RIGHT) - Pose skeleton ========== -->
  <!-- Falling person body outline -->
  <ellipse cx="400" cy="195" rx="22" ry="14" fill="#ff4444" opacity="0.15" transform="rotate(-50 400 195)"/>

  <!-- Pose skeleton - Falling diagonally -->
  <!-- Head -->
  <circle cx="365" cy="155" r="10" fill="none" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Neck to torso (tilted) -->
  <line x1="373" y1="162" x2="405" y2="195" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Shoulders (tilted) -->
  <line x1="385" y1="170" x2="400" y2="185" stroke="#ff4444" stroke-width="2.5"/>
  <line x1="385" y1="170" x2="370" y2="182" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Left arm (flailing up) -->
  <line x1="370" y1="182" x2="350" y2="170" stroke="#ff4444" stroke-width="2.5"/>
  <line x1="350" y1="170" x2="338" y2="155" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Right arm (reaching out) -->
  <line x1="400" y1="185" x2="425" y2="178" stroke="#ff4444" stroke-width="2.5"/>
  <line x1="425" y1="178" x2="445" y2="172" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Hips (tilted) -->
  <line x1="398" y1="200" x2="418" y2="192" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Left leg (bent) -->
  <line x1="398" y1="200" x2="388" y2="228" stroke="#ff4444" stroke-width="2.5"/>
  <line x1="388" y1="228" x2="380" y2="245" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Right leg (extended) -->
  <line x1="418" y1="192" x2="440" y2="218" stroke="#ff4444" stroke-width="2.5"/>
  <line x1="440" y1="218" x2="455" y2="235" stroke="#ff4444" stroke-width="2.5"/>
  <!-- Joints -->
  <circle cx="385" cy="170" r="3" fill="#ff4444"/>
  <circle cx="370" cy="182" r="3" fill="#ff4444"/>
  <circle cx="400" cy="185" r="3" fill="#ff4444"/>
  <circle cx="350" cy="170" r="3" fill="#ff4444"/>
  <circle cx="425" cy="178" r="3" fill="#ff4444"/>
  <circle cx="398" cy="200" r="3" fill="#ff4444"/>
  <circle cx="418" cy="192" r="3" fill="#ff4444"/>
  <circle cx="388" cy="228" r="3" fill="#ff4444"/>
  <circle cx="440" cy="218" r="3" fill="#ff4444"/>

  <!-- FALL DETECTED label with alert -->
  <rect x="340" y="125" width="120" height="22" fill="rgba(255,68,68,0.2)" stroke="#ff4444" stroke-width="2" rx="4">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="348" y="141" fill="#ff4444" font-family="monospace" font-size="12" font-weight="bold">⚠ FALL DETECTED</text>

  <!-- Bounding box for falling person -->
  <rect x="328" y="140" width="140" height="110" fill="none" stroke="#ff4444" stroke-width="2" rx="3"/>

  <!-- Motion trajectory arrow -->
  <path d="M375 158 Q 395 175, 410 200" fill="none" stroke="#ff8800" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.7"/>
  <polygon points="412,203 405,198 408,206" fill="#ff8800" opacity="0.7"/>

  <!-- Confidence score -->
  <rect x="328" y="252" width="90" height="16" fill="rgba(255,68,68,0.15)" rx="2"/>
  <text x="334" y="264" fill="#ff4444" font-family="monospace" font-size="10">Conf: 0.96</text>

  <!-- ========== HUD OVERLAY ========== -->
  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="32" fill="rgba(0,0,0,0.7)"/>
  <circle cx="15" cy="16" r="5" fill="#ff4444">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="26" y="20" fill="#ff4444" font-family="monospace" font-size="11" font-weight="bold">REC</text>
  <text x="70" y="20" fill="#aaa" font-family="monospace" font-size="11">CAM-01 | Room Monitor</text>
  <text x="440" y="20" fill="#aaa" font-family="monospace" font-size="11">14:32:07 | FPS: 30</text>

  <!-- Bottom status bar -->
  <rect x="0" y="310" width="600" height="30" fill="rgba(0,0,0,0.7)"/>
  <text x="10" y="329" fill="#00e5ff" font-family="monospace" font-size="10">Pose Estimation: MediaPipe | Fall Detection Model v2.1 | Accuracy: 96%</text>

  <!-- Alert indicator -->
  <rect x="480" y="315" width="110" height="20" fill="rgba(255,68,68,0.3)" stroke="#ff4444" stroke-width="1" rx="10">
    <animate attributeName="opacity" values="1;0.4;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="495" y="329" fill="#ff4444" font-family="monospace" font-size="10" font-weight="bold">🔔 ALERT SENT</text>
</svg>
